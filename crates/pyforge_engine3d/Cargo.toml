[package]
name = "pyforge_engine3d"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Backend 3D opcional Vulkan/OpenGL para ST y PyForge"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "pyforge-engine3d"
path = "src/main.rs"

[[bin]]
name = "pyforge-editor3d"
path = "src/editor_main.rs"
required-features = ["editor"]

[[bin]]
name = "pyforge-game3d"
path = "src/game_main.rs"
required-features = ["editor"]

[features]
default = []
editor = ["dep:eframe"]

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
glam = { version = "0.27", features = ["serde"] }
gltf = { version = "1.4", features = ["import"] }
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tobj = "4"
wgpu = { version = "0.19", features = ["glsl"] }
winit = "0.29"
# La interfaz usa Glow porque algunos controladores Vulkan/Mesa convertían el
# atlas de fuentes de egui en rectángulos opacos. El renderer 3D principal sigue
# usando wgpu y conserva sus backends Vulkan/OpenGL de forma independiente.
eframe = { version = "0.27", default-features = false, features = ["glow", "x11", "wayland"], optional = true }
