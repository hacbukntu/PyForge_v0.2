[package]
name = "pyforge"
version = "0.2.0"
edition = "2021"
description = "Compilador AOT del lenguaje ST basado en LLVM 21"
license = "MIT"

[lib]
name = "pyforge"
path = "src/lib.rs"

[dependencies]
# LLVM 21 es el único backend de ST. Inkwell mantiene la interfaz Rust y los targets
# se limitan a x86/AArch64 para evitar enlazar componentes que PyForge no utiliza.
inkwell = { version = "0.9.0", default-features = false, features = ["llvm21-1-force-dynamic", "target-x86", "target-aarch64", "no-libffi-linking"] }

[[bin]]
name = "pyforgec"
path = "src/bin/pyforgec.rs"

[[bin]]
name = "pyforge"
path = "src/bin/pyforge.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
